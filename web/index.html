<title>Dreszcz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Układ: jedna kolumna jak strona książki; numer paragrafu jako inicjał, wybory pod tekstem. */
:root {
  --tlo: #e6e9e4;         /* chłodny kamień */
  --karta: #f3f4f0;
  --atrament: #1d2420;
  --przygaszony: #5d665f;
  --akcent: #8a1f1f;      /* zaschnięta krew */
  --linia: #c9cec7;
  --f-tytul: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --f-tekst: "Alegreya", Georgia, "Times New Roman", serif;
  --f-cyfry: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --kosc-tlo: #fbfaf5;    /* kość z kości słoniowej */
  --kosc-ramka: #b9bdb4;
  --kosc-oczko: #1d2420;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tlo: #111513; --karta: #181d1a; --atrament: #dcd9cc; --przygaszony: #8f978f;
    --akcent: #d6a24a; --linia: #2b322e; --kosc-tlo: #e8e2cf; --kosc-ramka: #8c8571; --kosc-oczko: #6e1717; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tlo: #111513; --karta: #181d1a; --atrament: #dcd9cc; --przygaszony: #8f978f;
  --akcent: #d6a24a; --linia: #2b322e; --kosc-tlo: #e8e2cf; --kosc-ramka: #8c8571; --kosc-oczko: #6e1717; color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--tlo); color: var(--atrament);
  font: 1.125rem/1.6 var(--f-tekst);
  padding: 0 16px;
}
.strona { max-width: 36rem; margin: 0 auto; padding-block: 20px 40px; display: grid; gap: 22px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--linia); padding-bottom: 10px; }
h1 { font: 700 2rem/1 var(--f-tytul); margin: 0; letter-spacing: .02em; }
.licznik { font: 500 .75rem/1 var(--f-cyfry); color: var(--przygaszony); letter-spacing: .06em; text-transform: uppercase; }
.numer { font: 700 3.5rem/1 var(--f-tytul); color: var(--akcent); margin: 0; }
.tekst { margin: 0; max-width: 65ch; hyphens: auto; }
#akapit { display: grid; gap: 18px; }
.ekwipunek { margin-top: -14px; }
.ekwipunek summary { font: 500 .8rem/1 var(--f-cyfry); color: var(--przygaszony); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; padding-block: 8px; }
.ekwipunek ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.ekwipunek li { font-size: .95rem; padding: 4px 10px; border: 1px solid var(--linia); border-radius: 999px; background: var(--karta); }
.ekwipunek li.kartka { border-style: dashed; font-family: var(--f-cyfry); font-size: .85rem; }
.ekwipunek li.klucz { border-color: var(--akcent); font-family: var(--f-cyfry); font-size: .85rem; }
.zmiany { display: flex; flex-wrap: wrap; gap: 8px; }
.zmiany span { font: 500 .85rem/1 var(--f-cyfry); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--akcent); color: var(--akcent); }
.zmiany span.strata { border-style: dashed; }
.wybory .przycisk.cichy { justify-self: start; color: var(--atrament); }
.wybory { display: grid; gap: 10px; }
.wybor {
  display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%;
  font: 1.05rem/1.4 var(--f-tekst); color: var(--atrament);
  background: var(--karta); border: 1px solid var(--linia); border-radius: 6px;
  padding: 12px 14px; cursor: pointer;
}
.wybor:hover { border-color: var(--akcent); }
.wybor:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
.wybor .cel { font: 500 .8rem/1 var(--f-cyfry); color: var(--akcent); min-width: 3ch; font-variant-numeric: tabular-nums; }
.wybor .opis { min-width: 0; }
.klucze { display: flex; gap: 10px; flex-wrap: wrap; }
.klucze input { font: 500 1.1rem var(--f-cyfry); width: 7ch; padding: 10px; border: 1px solid var(--linia); border-radius: 6px; background: var(--karta); color: var(--atrament); }
.przycisk { font: 600 1rem var(--f-tekst); padding: 10px 16px; border-radius: 6px; border: 1px solid var(--akcent); background: var(--akcent); color: var(--tlo); cursor: pointer; }
.przycisk.cichy { background: transparent; color: var(--przygaszony); border-color: var(--linia); }
.koniec { font: 700 2.2rem/1.1 var(--f-tytul); color: var(--akcent); margin: 0; }
.uwaga { font-size: .9rem; color: var(--przygaszony); margin: 0; }
footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--linia); padding-top: 12px; }

/* Karta Wyprawy: cechy bohatera „aktualne / początkowe”, jak na papierowej karcie. */
.karta-wyprawy {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  background: var(--tlo); border-bottom: 1px solid var(--linia); padding-block: 8px;
}
.cecha { display: grid; gap: 2px; justify-items: center; }
.cecha b { font: 700 1.25rem/1 var(--f-tytul); color: var(--przygaszony); }
.cecha span { font: 500 .95rem/1 var(--f-cyfry); font-variant-numeric: tabular-nums; }
.cecha small { font: 500 .7rem/1 var(--f-cyfry); color: var(--przygaszony); }
.cecha.slabo span { color: var(--akcent); }

/* Walka */
.walka { display: grid; gap: 14px; border: 1px solid var(--akcent); border-radius: 8px; padding: 14px; background: var(--karta); }
.walka h2 { font: 700 1.5rem/1 var(--f-tytul); color: var(--akcent); margin: 0; }
.potwor { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.potwor.martwy { opacity: .45; text-decoration: line-through; }
.potwor .imie { font: 700 1.15rem/1.1 var(--f-tytul); letter-spacing: .03em; min-width: 0; }
.potwor .staty { font: 500 .85rem/1 var(--f-cyfry); font-variant-numeric: tabular-nums; }
.pasek { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--linia); overflow: hidden; }
.pasek i { display: block; height: 100%; background: var(--akcent); transition: width .3s; }
.akcje { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sss { display: flex; gap: 8px; align-items: center; font-size: .95rem; }
.sss input { width: 20px; height: 20px; accent-color: var(--akcent); }
.dziennik { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font: 500 .8rem/1.4 var(--f-cyfry); color: var(--przygaszony); }
.dziennik li:first-child { color: var(--atrament); }
.dziennik .zle { color: var(--akcent); }

/* Ekran startowy */
.start { display: grid; gap: 16px; }
.start h2 { font: 700 1.8rem/1.1 var(--f-tytul); margin: 0; }
.rzuty { display: grid; gap: 8px; margin: 0; }
.rzuty div { display: grid; grid-template-columns: 9rem 1fr; gap: 8px; align-items: baseline; }
.rzuty dt { font: 700 1.1rem var(--f-tytul); }
.rzuty dd { margin: 0; font: 500 .95rem var(--f-cyfry); font-variant-numeric: tabular-nums; }

/* Kości: ścianka 3×3, oczka zapalane według wartości (data-v). */
.tacka { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.rzut { display: grid; gap: 6px; justify-items: start; }
.rzut .kto { font: 500 .7rem/1 var(--f-cyfry); color: var(--przygaszony); letter-spacing: .06em; text-transform: uppercase; }
.rzut .para { display: flex; gap: 8px; align-items: center; }
.rzut .suma { font: 500 .9rem/1 var(--f-cyfry); font-variant-numeric: tabular-nums; }
.kosc {
  --bok: 2.4rem;
  width: var(--bok); height: var(--bok); padding: 5px; box-sizing: border-box;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 2px;
  background: var(--kosc-tlo); border: 1px solid var(--kosc-ramka); border-radius: 22%;
  box-shadow: inset 0 -3px 0 var(--kosc-ramka);
}
.kosc i { border-radius: 50%; background: transparent; margin: 1px; }
.kosc i.on { background: var(--kosc-oczko); }
.kosc.maly { --bok: 1.8rem; padding: 4px; }
.kosc.pusta {
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font: 600 1.1rem/1 var(--f-cyfry); color: var(--przygaszony);
  border-style: dashed; box-shadow: none; background: transparent;
}
.kosc.pusta:not(:disabled) { border-color: var(--akcent); color: var(--akcent); }
.kosc.pusta:disabled { opacity: .45; cursor: default; }
.rzut-kosci { display: grid; gap: 10px; }
.rzut-kosci .para { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rzut-kosci .suma { font: 500 1.1rem/1 var(--f-cyfry); font-variant-numeric: tabular-nums; }
.rzut-kosci .kosc { --bok: 3rem; padding: 6px; }
.kosc.toczy { animation: toczy .45s cubic-bezier(.3,.7,.4,1); }
@keyframes toczy {
  0% { transform: translateY(-10px) rotate(-200deg) scale(.85); }
  70% { transform: translateY(2px) rotate(12deg); }
  100% { transform: none; }
}
.dziennik li.nowy { animation: pojaw .2s .45s both; }
@keyframes pojaw { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .kosc.toczy, .dziennik li.nowy { animation: none; }
}

@media (prefers-reduced-motion: no-preference) {
  .numer, .tekst { animation: odslon .35s ease-out both; }
  @keyframes odslon { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

/* Mapa wędrówki: pełny ekran nad grą. */
.przyciski { display: flex; gap: 8px; }
.mapa {
  position: fixed; inset: 0; z-index: 10; background: var(--tlo);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.mapa-naglowek { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--linia); }
.mapa-naglowek h2 { font: 700 1.5rem/1 var(--f-tytul); margin: 0; }
.mapa-plotno { position: relative; overflow: hidden; touch-action: none; min-height: 0; }
.mapa-plotno svg { width: 100%; height: 100%; display: block; cursor: grab; }
.mapa-zoom { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 8px; }
.mapa-zoom button { width: 44px; height: 44px; font: 600 1.3rem/1 var(--f-cyfry); border-radius: 50%; border: 1px solid var(--linia); background: var(--karta); color: var(--atrament); cursor: pointer; }
.mapa-podpis { padding: 12px 16px; border-top: 1px solid var(--linia); min-height: 3.2em; font-size: 1rem; }
.mapa-podpis b { font: 700 1.2rem var(--f-tytul); color: var(--akcent); margin-right: 6px; }
.mapa-legenda { font: 500 .72rem/1.5 var(--f-cyfry); color: var(--przygaszony); padding: 0 16px 10px; }
.wezel { outline: none; cursor: pointer; }
.wezel:focus-visible circle { stroke: var(--akcent); stroke-width: 3; }
.wezel circle { fill: var(--karta); stroke: var(--przygaszony); stroke-width: 1.5; }
.wezel.wielokrotny circle { stroke: var(--atrament); stroke-width: 3; }
.wezel.biezacy circle { fill: var(--akcent); stroke: var(--akcent); }
.wezel.wybrany circle { stroke: var(--akcent); stroke-width: 3; }
.wezel text { font: 500 10px var(--f-cyfry); fill: var(--atrament); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.wezel.biezacy text { fill: var(--tlo); }
.droga { stroke: var(--przygaszony); stroke-width: 1.3; fill: none; }
.kikut { stroke: var(--akcent); stroke-width: 1.5; stroke-dasharray: 2 3; }
.grot { fill: var(--przygaszony); }
</style>

<main class="strona">
  <header>
    <h1>Dreszcz</h1>
    <span class="licznik" id="licznik">wczytywanie…</span>
  </header>
  <div class="karta-wyprawy" id="karta" hidden></div>
  <details class="ekwipunek" id="ekwipunek" hidden>
    <summary>Ekwipunek</summary>
    <ul id="lista-rzeczy"></ul>
  </details>
  <section id="akapit" aria-live="polite">
    <p class="uwaga">Wczytuję księgę…</p>
  </section>
  <footer>
    <span class="licznik" id="stos"></span>
    <div class="przyciski">
      <button class="przycisk cichy" id="pokaz-mape" type="button">Mapa</button>
      <button class="przycisk cichy" id="nowa" type="button">Nowa gra</button>
    </div>
  </footer>
</main>

<div class="mapa" id="mapa" hidden role="dialog" aria-label="Mapa wędrówki">
  <div class="mapa-naglowek">
    <h2>Mapa wędrówki</h2>
    <button class="przycisk cichy" id="zamknij-mape" type="button">Wróć do gry</button>
  </div>
  <div class="mapa-plotno" id="plotno">
    <svg id="mapa-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="mapa-zoom">
      <button type="button" id="zoom-plus" aria-label="Przybliż">+</button>
      <button type="button" id="zoom-minus" aria-label="Oddal">−</button>
      <button type="button" id="zoom-tu" aria-label="Pokaż, gdzie jestem">◎</button>
    </div>
  </div>
  <div>
    <p class="mapa-podpis" id="mapa-podpis">Dotknij punktu, by przypomnieć sobie to miejsce.</p>
    <p class="mapa-legenda">● tu jesteś · gruby pierścień = byłeś kilka razy · przerywane kreski = niezbadane wyjścia</p>
  </div>
</div>

<script src="silnik.js"></script>
<script>
// Interfejs: tylko rysowanie ekranu i obsługa kliknięć.
// Cała logika gry (przejścia, walka, SSS) jest w silnik.js.
let ksiega = {};
let stan = null;
let uzyjSSS = false;
const KLUCZ_ZAPISU = "dreszcz-stan";

function zapisz() {
  try { localStorage.setItem(KLUCZ_ZAPISU, JSON.stringify(stan)); } catch (e) { /* brak pamięci – gramy dalej */ }
}
function wczytajZapis() {
  try { return JSON.parse(localStorage.getItem(KLUCZ_ZAPISU)); } catch (e) { return null; }
}

/** Mały pomocnik do tworzenia elementów: el("p", "klasa", "tekst"). */
function el(tag, klasa = "", tekst = "") {
  const e = document.createElement(tag);
  if (klasa) e.className = klasa;
  if (tekst !== "") e.textContent = tekst;
  return e;
}

function zmien(nowyStan, przewin = true) {
  // Po każdym ruchu: efekty paragrafu (złoto, cechy) – silnik pilnuje, by raz.
  stan = zastosujEfekty(nowyStan, ksiega[nowyStan.akapit]);
  zapisz();
  rysuj();
  if (przewin) window.scrollTo({ top: 0 });
}

function idz(przejscie, numer) {
  uzyjSSS = false;
  zmien(wykonajPrzejscie(stan, przejscie, numer, ksiega));
}

// ---------------------------------------------------------------- rysowanie

function rysujKarte() {
  const karta = document.getElementById("karta");
  const b = stan?.bohater;
  karta.hidden = !b;
  document.getElementById("ekwipunek").hidden = !b;
  if (!b) return;
  karta.replaceChildren();
  const cechy = [["Z", "Zręczność"], ["W", "Wytrzymałość"], ["S", "Szczęście"]];
  for (const [k, nazwa] of cechy) {
    const c = el("div", "cecha" + (b[k] <= b.start[k] / 3 ? " slabo" : ""));
    c.title = nazwa;
    c.append(el("b", "", k), el("span", "", `${b[k]}/${b.start[k]}`), el("small", "", nazwa.toLowerCase()));
    karta.append(c);
  }
  const p = el("div", "cecha");
  p.title = "Prowiant";
  p.append(el("b", "", "P"), el("span", "", String(b.prowiant)), el("small", "", "prowiant"));
  const z = el("div", "cecha");
  z.title = "Złoto";
  z.append(el("b", "", "Zł"), el("span", "", String(b.zloto ?? 0)), el("small", "", "złoto"));
  karta.append(p, z);

  const rzeczy = b.ekwipunek ?? [];
  const szczegoly = document.getElementById("ekwipunek");
  szczegoly.hidden = false;
  szczegoly.querySelector("summary").textContent = `Ekwipunek (${rzeczy.length})`;
  const lista = document.getElementById("lista-rzeczy");
  lista.replaceChildren(...rzeczy.map((r) => el("li", r.startsWith("klucz ") ? "klucz" : "", r)));
  // „Zapisz ten numer” – gra pamięta sama (stos powrotów); tu tylko pokazujemy kartkę.
  for (const nr of stan.stos) lista.append(el("li", "kartka", `kartka: zapisany numer ${nr}`));
}

function rysuj() {
  const box = document.getElementById("akapit");
  box.replaceChildren();
  rysujKarte();

  if (!stan.bohater) { rysujStart(box); return; }

  const p = ksiega[stan.akapit];
  document.getElementById("licznik").textContent = `krok ${stan.historia.length} · paragraf ${stan.akapit}`
    + (stan.wskrzeszenia ? ` · wskrzeszeń ${stan.wskrzeszenia}` : "");
  document.getElementById("stos").textContent = stan.stos.length ? `zapisany numer: ${stan.stos.at(-1)}` : "";

  if (stan.koniec) {
    box.append(el("p", "koniec", stan.koniec === "zwyciestwo" ? "Zwycięstwo!" : "Koniec przygody"));
    if (stan.walka && stan.koniec === "porazka") box.append(rysujWalke(p));
    box.append(el("p", "uwaga", `Odwiedzone paragrafy: ${stan.historia.length}. Zacznij od nowa przyciskiem poniżej.`));
    if (stan.koniec === "porazka" && stan.bohater) {
      // Tryb testowy – do sprawdzania dalszych paragrafów bez zaczynania od nowa.
      const b = el("button", "przycisk cichy", "Tryb testowy: wróć tu jako zwycięzca");
      b.type = "button";
      b.addEventListener("click", () => zmien(wskrzes(stan)));
      box.append(b);
    }
    return;
  }

  box.append(el("p", "numer", stan.akapit));
  box.append(el("p", "tekst", p ? tekstAkapitu(stan, p) : `Brak paragrafu ${stan.akapit} w księdze.`));
  if (stan.walka) box.append(rysujWalke(p));
  if (potworyPokonane(stan, p)) box.append(el("p", "uwaga", "Potwory, które tu pokonałeś, wciąż leżą na ziemi – nie musisz walczyć drugi raz."));
  if (stan.zmiany?.length) {
    const z = el("div", "zmiany");
    stan.zmiany.forEach((opis) => z.append(el("span", opis.startsWith("−") ? "strata" : "", opis)));
    box.append(z);
  }

  // SSS poza walką: przycisk testu, a po teście kości i wynik.
  if (czekaNaSSS(stan, p) && !stan.walka) {
    const b = el("button", "przycisk", `Sprawdź Swoje Szczęście (SSS, masz S ${stan.bohater.S})`);
    b.type = "button";
    b.addEventListener("click", () => { animujSSS = true; zmien(testSzczescia(stan), false); });
    box.append(b);
  } else if (stan.testSSS?.akapit === stan.akapit) {
    const t = stan.testSSS;
    const tacka = el("div", "tacka");
    tacka.append(rzut("SSS", t.rzut.oczka,
      `= ${t.rzut.suma} ${t.szczescie ? "≤" : ">"} ${t.poziom} · ${t.szczescie ? "masz SZCZĘŚCIE" : "nie masz SZCZĘŚCIA"}`, animujSSS));
    animujSSS = false;
    box.append(tacka);
  }

  if (p?.rzut_kosci && !stan.walka) box.append(rysujRzutKosci(p));

  const wybory = el("div", "wybory");
  for (const opcja of dostepneOpcje(stan, p)) {
    const b = el("button", "przycisk cichy", opcja.efekt.opcja);
    b.type = "button";
    b.addEventListener("click", () => zmien(wezOpcje(stan, opcja), false));
    wybory.append(b);
  }
  if (moznaJesc(stan, p)) {
    const b = el("button", "przycisk cichy", `Zjedz posiłek (+4 W, zostanie ${stan.bohater.prowiant - 1})`);
    b.type = "button";
    b.addEventListener("click", () => zmien(zjedzPosilek(stan), false));
    wybory.append(b);
  }
  for (const przejscie of dostepnePrzejscia(stan, p)) {
    if (przejscie.target === "KEYS_SUM") { wybory.append(poleKluczy(przejscie)); continue; }
    const b = el("button", "wybor");
    b.type = "button";
    b.append(
      el("span", "cel", /^\d+$/.test(String(przejscie.target)) ? przejscie.target : "→"),
      el("span", "opis", etykieta(przejscie)),
    );
    b.addEventListener("click", () => idz(przejscie));
    wybory.append(b);
  }
  box.append(wybory);
  if (pamiecRozstrzyga(stan, p)) {

}

// Które pola siatki 3×3 (numerowane 0–8) mają oczko dla danej wartości.
const OCZKA = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const ruchDozwolony = () => !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function ustawOczka(kosc, wartosc) {
  kosc.querySelectorAll("i").forEach((oczko, i) => oczko.classList.toggle("on", OCZKA[wartosc].includes(i)));
  kosc.setAttribute("aria-label", `kość: ${wartosc}`);
}

/**
 * Jedna kość. Gdy animuj = true, przez chwilę „miga” losowymi ściankami,
 * a potem zatrzymuje się na prawdziwym wyniku (wynik jest już znany –
 * animacja tylko go pokazuje).
 */
function kosc(wartosc, animuj = false, maly = false) {
  const k = el("span", "kosc" + (maly ? " maly" : ""));
  k.setAttribute("role", "img");
  for (let i = 0; i < 9; i++) k.append(el("i"));
  if (!animuj || !ruchDozwolony()) { ustawOczka(k, wartosc); return k; }
  k.classList.add("toczy");
  const migotanie = setInterval(() => ustawOczka(k, 1 + Math.floor(Math.random() * 6)), 70);
  ustawOczka(k, 1 + Math.floor(Math.random() * 6));
  setTimeout(() => { clearInterval(migotanie); ustawOczka(k, wartosc); }, 420);
  return k;
}

/** Grupa: podpis, kości i opis wyniku, np. „Ty · ⚃⚄ · +Z 9 = 18”. */
function rzut(kto, oczka, opis, animuj, maly = false) {

  para.append(el("span", "suma", opis));
  r.append(el("span", "kto", kto), para);
  return r;
}

/** Kości ostatniej rundy: Ty, potwór i – jeśli było – SSS. */

function wpisDziennika(r, opis) {
  const premia = (opis.hero_Z_bonus ?? 0) + (opis.hero_attack_bonus ?? 0);
  const ty = `Ty ${r.b.oczka.join("+")}+${stan.bohater.Z}${premia ? (premia > 0 ? "+" : "") + premia : ""}=${r.silaBohatera}`;
  const on = `${r.potwor} ${r.a.oczka.join("+")}+Z=${r.silaPotwora}`;
  let wynik = "remis, powtórka";
  if (r.wynik === "trafiasz") wynik = `trafiasz: −${r.rana} W`;
  if (r.wynik === "obrywasz") wynik = `obrywasz: −${r.rana} W`;
  if (r.sss !== undefined) wynik += r.sss ? " (masz SZCZĘŚCIE)" : " (bez SZCZĘŚCIA)";
  return el("li", r.wynik === "obrywasz" ? "zle" : "", `${ty} · ${on} → ${wynik}`);
}

// ---------------------------------------------------------------- mapa
// Układ „siłowy”: punkty odpychają się jak magnesy, drogi ściągają je
// jak sprężyny. Po kilkuset krokach obraz się uspokaja.
const SVG = "http://www.w3.org/2000/svg";
const pozycje = new Map();   // id paragrafu → {x, y}; zostają między otwarciami mapy
let widok = null;            // {x, y, w, h} – fragment mapy widoczny na ekranie

function svgEl(tag, atrybuty = {}) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(atrybuty)) e.setAttribute(k, v);
  return e;
}

/** Nowy punkt startuje obok paragrafu, z którego do niego przyszliśmy. */
function zasiej(graf) {
  const historia = stan.historia;
  for (let i = 0; i < historia.length; i++) {
    const id = historia[i];
    if (pozycje.has(id)) continue;
    const rodzic = pozycje.get(historia[i - 1]) ?? { x: 0, y: 0 };
    const kat = (Number(id) * 2.399) % (2 * Math.PI);   // „złoty kąt” – rozrzut bez losowania
    pozycje.set(id, { x: rodzic.x + Math.cos(kat) * 70, y: rodzic.y + Math.sin(kat) * 70 });
  }
}

function rozmiesc(graf, krokow = 300) {
  const ids = graf.wezly.map((w) => w.id);
  const DLUGOSC = 70;
  for (let krok = 0; krok < krokow; krok++) {
    const temp = 8 * (1 - krok / krokow) + 0.5;   // „stygnięcie”: ruchy coraz mniejsze
    const sila = new Map(ids.map((id) => [id, { x: 0, y: 0 }]));
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const a = pozycje.get(ids[i]), b = pozycje.get(ids[j]);
        let dx = a.x - b.x, dy = a.y - b.y;
        const d2 = Math.max(dx * dx + dy * dy, 1);
        const f = (DLUGOSC * DLUGOSC) / d2;          // odpychanie
        sila.get(ids[i]).x += dx * f / 10; sila.get(ids[i]).y += dy * f / 10;
        sila.get(ids[j]).x -= dx * f / 10; sila.get(ids[j]).y -= dy * f / 10;
      }
    }
    for (const [u, v] of graf.krawedzie) {
      const a = pozycje.get(u), b = pozycje.get(v);
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - DLUGOSC) / d * 0.2;            // sprężyna
      sila.get(u).x += dx * f; sila.get(u).y += dy * f;
      sila.get(v).x -= dx * f; sila.get(v).y -= dy * f;
    }
    for (const id of ids) {
      const p = pozycje.get(id), s = sila.get(id);
      const d = Math.hypot(s.x, s.y) || 1;
      const ruch = Math.min(d, temp);
      p.x += s.x / d * ruch; p.y += s.y / d * ruch;
    }
  }
}

function ustawWidok() {
  const svg = document.getElementById("mapa-svg");
  svg.setAttribute("viewBox", `${widok.x} ${widok.y} ${widok.w} ${widok.h}`);
}

function dopasujWidok(ids) {
  const pkt = ids.map((id) => pozycje.get(id));
  const xs = pkt.map((p) => p.x), ys = pkt.map((p) => p.y);
  const pole = document.getElementById("plotno").getBoundingClientRect();
  const proporcja = pole.width / Math.max(pole.height, 1);
  let w = Math.max(...xs) - Math.min(...xs) + 120, h = Math.max(...ys) - Math.min(...ys) + 120;
  if (w / h < proporcja) w = h * proporcja; else h = w / proporcja;
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  widok = { x: cx - w / 2, y: cy - h / 2, w, h };
  ustawWidok();
}

function powieksz(czynnik, srodek = null) {
  const c = srodek ?? { x: widok.x + widok.w / 2, y: widok.y + widok.h / 2 };
  widok = { x: c.x - (c.x - widok.x) * czynnik, y: c.y - (c.y - widok.y) * czynnik, w: widok.w * czynnik, h: widok.h * czynnik };
  ustawWidok();
}

function rysujMape() {
  const graf = grafWedrowki(stan, ksiega);
  zasiej(graf);
  rozmiesc(graf);
  const svg = document.getElementById("mapa-svg");
  svg.replaceChildren();

  const defs = svgEl("defs");
  const grot = svgEl("marker", { id: "grot", viewBox: "0 0 10 10", refX: "10", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
  grot.append(svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "grot" }));
  defs.append(grot);
  svg.append(defs);

  const R = 14;
  for (const [u, v] of graf.krawedzie) {
    const a = pozycje.get(u), b = pozycje.get(v);
    const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
    svg.append(svgEl("line", {
      class: "droga", "marker-end": "url(#grot)",
      x1: a.x + ux * R, y1: a.y + uy * R, x2: b.x - ux * (R + 2), y2: b.y - uy * (R + 2),
    }));
  }

  for (const w of graf.wezly) {
    const p = pozycje.get(w.id);
    const g = svgEl("g", { class: "wezel" + (w.biezacy ? " biezacy" : "") + (w.odwiedzin > 1 ? " wielokrotny" : ""), tabindex: "0", role: "button" });
    // kikuty niezbadanych wyjść – skierowane od środka mapy na zewnątrz
    for (let k = 0; k < Math.min(w.niezbadane, 4); k++) {
      const kat = Math.atan2(p.y, p.x) + (k - (Math.min(w.niezbadane, 4) - 1) / 2) * 0.6;
      g.append(svgEl("line", { class: "kikut", x1: p.x + Math.cos(kat) * R, y1: p.y + Math.sin(kat) * R, x2: p.x + Math.cos(kat) * (R + 12), y2: p.y + Math.sin(kat) * (R + 12) }));
    }
    g.append(svgEl("circle", { cx: p.x, cy: p.y, r: R }));
    const t = svgEl("text", { x: p.x, y: p.y });
    t.textContent = w.id;
    g.append(t);
    const pokaz = () => {
      svg.querySelectorAll(".wybrany").forEach((x) => x.classList.remove("wybrany"));
      g.classList.add("wybrany");
      const podpis = document.getElementById("mapa-podpis");
      podpis.replaceChildren(el("b", "", w.id), document.createTextNode(pierwszeZdanie(ksiega[w.id])));
      if (w.odwiedzin > 1) podpis.append(el("span", "uwaga", ` (byłeś tu ${w.odwiedzin} razy)`));
    };
    g.addEventListener("click", pokaz);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") pokaz(); });
    svg.append(g);
  }
  return graf;
}

function otworzMape() {
  document.getElementById("mapa").hidden = false;
  const graf = rysujMape();
  dopasujWidok(graf.wezly.map((w) => w.id));
  // Duża mapa: zamiast mikroskopijnych kółek pokaż okolicę miejsca, w którym jesteś
  // (mniej więcej 1 jednostka mapy = 1 piksel ekranu).
  const pole = document.getElementById("plotno").getBoundingClientRect();
  if (widok.w > pole.width * 1.3) {
    const p = pozycje.get(stan.akapit);
    const w = pole.width * 1.1, h = w * pole.height / pole.width;
    widok = { x: p.x - w / 2, y: p.y - h / 2, w, h };
    ustawWidok();
  }
}

document.getElementById("pokaz-mape").addEventListener("click", otworzMape);
document.getElementById("zamknij-mape").addEventListener("click", () => { document.getElementById("mapa").hidden = true; });
document.getElementById("zoom-plus").addEventListener("click", () => powieksz(0.7));
document.getElementById("zoom-minus").addEventListener("click", () => powieksz(1 / 0.7));
document.getElementById("zoom-tu").addEventListener("click", () => {
  const p = pozycje.get(stan.akapit);
  widok = { ...widok, x: p.x - widok.w / 2, y: p.y - widok.h / 2 };
  ustawWidok();
});

// Przesuwanie mapy palcem (pointer events działają dla myszy i dotyku).
(() => {
  const svg = document.getElementById("mapa-svg");
  let start = null;
  svg.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".wezel")) return;
    start = { x: e.clientX, y: e.clientY, widok: { ...widok } };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (!start) return;
    const skala = widok.w / svg.getBoundingClientRect().width;
    widok = { ...start.widok, x: start.widok.x - (e.clientX - start.x) * skala, y: start.widok.y - (e.clientY - start.y) * skala };
    ustawWidok();
  });
  svg.addEventListener("pointerup", () => { start = null; });
  svg.addEventListener("pointercancel", () => { start = null; });
})();
