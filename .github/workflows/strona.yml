# Buduje grę (web/zbuduj.py) i publikuje ją na GitHub Pages
# przy każdym pushu na master.
name: Strona gry

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testy-i-budowa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testy książki
        run: python -m unittest -v test_ksiega
      - name: Testy silnika
        run: node --test web/silnik.test.js
      - name: Budowa strony
        run: python web/zbuduj.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publikacja:
    needs: testy-i-budowa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
